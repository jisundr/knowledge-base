name: Document checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vault structure, frontmatter and links
        run: python3 tests/check-docs.py

      - name: Ingest command static checks
        run: bash tests/test-ingest.sh --static
